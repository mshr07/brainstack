name: adsage

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adsage}
      POSTGRES_USER: ${POSTGRES_USER:-adsage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [adsage-private]

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [adsage-private]

  neo4j:
    image: neo4j:5.26.12-community
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/local-only-change-me}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [adsage-private]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-adsage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-only-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [adsage-private]

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-adsage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-only-change-me}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/adsage-lake &&
        mc anonymous set none local/adsage-lake
    networks: [adsage-private]

  ai-orchestrator:
    profiles: [app]
    build: ./services/ai-orchestrator
    environment:
      ADSAGE_ENVIRONMENT: local
      ADSAGE_AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-local-development-token-change-me}
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [adsage-private]

  platform:
    profiles: [app]
    build: ./services/adsage-platform-service
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      ai-orchestrator: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-adsage}
      DB_USERNAME: ${POSTGRES_USER:-adsage}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      REDIS_HOST: redis
      AI_ORCHESTRATOR_BASE_URL: http://ai-orchestrator:8090
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-local-development-token-change-me}
      DEV_JWT_SECRET: ${DEV_JWT_SECRET:-local-development-jwt-secret-at-least-32-bytes}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [adsage-private]

  web:
    profiles: [app]
    build: ./apps/web
    depends_on:
      platform: { condition: service_healthy }
    ports:
      - "5173:8080"
    networks: [adsage-private]

volumes:
  postgres-data:
  redis-data:
  neo4j-data:
  minio-data:

networks:
  adsage-private:
    driver: bridge
