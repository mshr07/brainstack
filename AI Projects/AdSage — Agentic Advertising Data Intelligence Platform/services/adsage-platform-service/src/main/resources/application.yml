spring:
  application:
    name: adsage-platform-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/adsage}
    username: ${DB_USERNAME:adsage}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms

server:
  shutdown: graceful
  max-http-request-header-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING_PROBABILITY:0.1}

adsage:
  security:
    issuer: ${JWT_ISSUER_URI:https://example.invalid/oauth2/default}
    jwk-set-uri: ${JWT_JWK_SET_URI:https://example.invalid/oauth2/default/v1/keys}
    audience: ${JWT_AUDIENCE:api://adsage}
    dev-hmac-secret: ${DEV_JWT_SECRET:}
    allowed-origins: ${ALLOWED_ORIGINS:}
  ai-orchestrator:
    base-url: ${AI_ORCHESTRATOR_BASE_URL:http://localhost:8090}
    internal-token: ${AI_INTERNAL_TOKEN}
    connect-timeout: 1s
    read-timeout: 9s
