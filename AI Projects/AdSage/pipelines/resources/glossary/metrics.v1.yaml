glossary_version: 1
metrics:
  - metric_id: impressions
    display_name: Impressions
    description: Count of served impression events.
    formula: SUM(impressions)
    aggregation_rule: additive
    required_measures: [impressions]
    allowed_grain: [tenant_id, metric_date, advertiser_id, campaign_id, country_code, device_type, placement_id, currency, attribution_version]
    owner: adsage-data
    semantic_version: 1.0.0
    valid_from: 2026-08-01
  - metric_id: clicks
    display_name: Clicks
    description: Count of valid click events.
    formula: SUM(clicks)
    aggregation_rule: additive
    required_measures: [clicks]
    allowed_grain: [tenant_id, metric_date, advertiser_id, campaign_id, country_code, device_type, placement_id, currency, attribution_version]
    owner: adsage-data
    semantic_version: 1.0.0
    valid_from: 2026-08-01
  - metric_id: ctr
    display_name: Click-through rate
    description: Clicks divided by impressions, recomputed at the requested grain.
    formula: SUM(clicks) / NULLIF(SUM(impressions), 0)
    aggregation_rule: recompute_ratio
    required_measures: [clicks, impressions]
    allowed_grain: [tenant_id, metric_date, advertiser_id, campaign_id, country_code, device_type, placement_id, currency, attribution_version]
    owner: adsage-data
    semantic_version: 1.0.0
    valid_from: 2026-08-01
  - metric_id: spend
    display_name: Advertising spend
    description: Advertising delivery cost in the row currency.
    formula: SUM(advertising_spend)
    aggregation_rule: additive
    required_measures: [advertising_spend]
    allowed_grain: [tenant_id, metric_date, advertiser_id, campaign_id, country_code, device_type, placement_id, currency, attribution_version]
    owner: adsage-data
    semantic_version: 1.0.0
    valid_from: 2026-08-01
  - metric_id: cpc
    display_name: Cost per click
    description: Spend divided by clicks, recomputed at the requested grain.
    formula: SUM(advertising_spend) / NULLIF(SUM(clicks), 0)
    aggregation_rule: recompute_ratio
    required_measures: [advertising_spend, clicks]
    allowed_grain: [tenant_id, metric_date, advertiser_id, campaign_id, country_code, device_type, placement_id, currency, attribution_version]
    owner: adsage-data
    semantic_version: 1.0.0
    valid_from: 2026-08-01
  - metric_id: cpm
    display_name: Cost per thousand impressions
    description: One thousand times spend divided by impressions.
    formula: 1000 * SUM(advertising_spend) / NULLIF(SUM(impressions), 0)
    aggregation_rule: recompute_ratio
    required_measures: [advertising_spend, impressions]
    allowed_grain: [tenant_id, metric_date, advertiser_id, campaign_id, country_code, device_type, placement_id, currency, attribution_version]
    owner: adsage-data
    semantic_version: 1.0.0
    valid_from: 2026-08-01
  - metric_id: conversions
    display_name: Attributed conversions
    description: Conversions credited by the row attribution version.
    formula: SUM(attributed_conversions)
    aggregation_rule: attribution_bound
    required_measures: [attributed_conversions]
    allowed_grain: [tenant_id, metric_date, advertiser_id, campaign_id, country_code, device_type, placement_id, currency, attribution_version]
    owner: adsage-data
    semantic_version: 1.0.0
    valid_from: 2026-08-01
  - metric_id: cvr
    display_name: Conversion rate
    description: Attributed conversions divided by clicks at one attribution version.
    formula: SUM(attributed_conversions) / NULLIF(SUM(clicks), 0)
    aggregation_rule: recompute_ratio
    required_measures: [attributed_conversions, clicks]
    allowed_grain: [tenant_id, metric_date, advertiser_id, campaign_id, country_code, device_type, placement_id, currency, attribution_version]
    owner: adsage-data
    semantic_version: 1.0.0
    valid_from: 2026-08-01
  - metric_id: attributed_sales
    display_name: Attributed sales
    description: Sales credited by the row attribution version and currency.
    formula: SUM(attributed_sales)
    aggregation_rule: attribution_bound
    required_measures: [attributed_sales]
    allowed_grain: [tenant_id, metric_date, advertiser_id, campaign_id, country_code, device_type, placement_id, currency, attribution_version]
    owner: adsage-data
    semantic_version: 1.0.0
    valid_from: 2026-08-01
  - metric_id: roas
    display_name: Return on advertising spend
    description: Attributed sales divided by spend at one currency and attribution version.
    formula: SUM(attributed_sales) / NULLIF(SUM(advertising_spend), 0)
    aggregation_rule: recompute_ratio
    required_measures: [attributed_sales, advertising_spend]
    allowed_grain: [tenant_id, metric_date, advertiser_id, campaign_id, country_code, device_type, placement_id, currency, attribution_version]
    owner: adsage-data
    semantic_version: 1.0.0
    valid_from: 2026-08-01
  - metric_id: acos
    display_name: Advertising cost of sales
    description: Spend divided by attributed sales at one currency and attribution version.
    formula: SUM(advertising_spend) / NULLIF(SUM(attributed_sales), 0)
    aggregation_rule: recompute_ratio
    required_measures: [advertising_spend, attributed_sales]
    allowed_grain: [tenant_id, metric_date, advertiser_id, campaign_id, country_code, device_type, placement_id, currency, attribution_version]
    owner: adsage-data
    semantic_version: 1.0.0
    valid_from: 2026-08-01
  - metric_id: cpa
    display_name: Cost per attributed conversion
    description: Spend divided by attributed conversions at one attribution version.
    formula: SUM(advertising_spend) / NULLIF(SUM(attributed_conversions), 0)
    aggregation_rule: recompute_ratio
    required_measures: [advertising_spend, attributed_conversions]
    allowed_grain: [tenant_id, metric_date, advertiser_id, campaign_id, country_code, device_type, placement_id, currency, attribution_version]
    owner: adsage-data
    semantic_version: 1.0.0
    valid_from: 2026-08-01
