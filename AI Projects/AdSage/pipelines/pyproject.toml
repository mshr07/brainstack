[project]
name = "adsage-data-pipelines"
version = "0.2.0"
description = "Deterministic synthetic advertising lake and governed medallion pipelines"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "duckdb==1.5.5",
  "pyarrow==25.0.1",
  "pydantic>=2.11,<3",
  "pyspark==4.2.0",
  "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[project.scripts]
adsage-data = "adsage_pipelines.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adsage_pipelines"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["spark: starts a local Spark runtime"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["adsage_pipelines"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
