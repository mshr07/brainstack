openapi: 3.1.0
info:
  title: AdSage Platform API
  version: 1.0.0-phase1
  description: Public, authenticated platform boundary. Phase 1 implements message submission; remaining operations are target contracts.
servers:
  - url: http://localhost:8080
security:
  - oauth2: [analysis:run]
paths:
  /v1/conversations:
    get:
      operationId: listConversations
      summary: List caller-visible conversations (Phase 3)
      security:
        - oauth2: [conversation:read]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Caller-visible page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      operationId: createConversation
      summary: Create a conversation (Phase 3)
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string, maxLength: 256 }
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/conversations/{conversationId}/messages:
    post:
      operationId: submitConversationMessage
      summary: Submit a question to a conversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitMessageRequest"
      responses:
        "202":
          description: The bounded orchestration run was accepted. Phase 1 may already contain its deterministic terminal result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunAccepted"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
  /v1/runs/{runId}:
    get:
      operationId: getRun
      summary: Get an authorized run snapshot (Phase 3)
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Current run snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunAccepted" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/runs/{runId}/events:
    get:
      operationId: streamRunEvents
      summary: Stream policy-filtered run events (Phase 3)
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Server-sent events
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/approvals/{approvalId}/decision:
    post:
      operationId: decideApproval
      summary: Approve, edit, or reject a pending action (Phase 3)
      security:
        - oauth2: [approval:decide]
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: Recorded decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "409": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/runs/{runId}/feedback:
    post:
      operationId: submitFeedback
      summary: Store reviewable feedback (Phase 3)
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Feedback" }
      responses:
        "202": { description: Feedback accepted for review }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/metadata/search:
    get:
      operationId: searchMetadata
      summary: Search published metadata under caller policy (Phase 4)
      security:
        - oauth2: [metadata:read]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 1000 }
        - name: domain
          in: query
          schema: { type: string, maxLength: 128 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Ranked, ACL-filtered published entities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataSearchResponse" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/metadata/datasets/{datasetId}:
    get:
      operationId: getDatasetSchema
      summary: Get a published dataset schema and governance metadata (Phase 4)
      security:
        - oauth2: [metadata:read]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: datasetId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: version
          in: query
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Published schema version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatasetSchema" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/metadata/join-path:
    get:
      operationId: findJoinPath
      summary: Find a bounded governed join path (Phase 6)
      security:
        - oauth2: [metadata:read]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: from
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: to
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: maxHops
          in: query
          schema: { type: integer, minimum: 1, maximum: 6, default: 4 }
      responses:
        "200":
          description: Zero or more published relationship paths
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items: { $ref: "#/components/schemas/JoinEdge" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /v1/metrics/{metricName}:
    get:
      operationId: getMetricDefinition
      summary: Get the canonical published metric valid at a point in time (Phase 4)
      security:
        - oauth2: [metadata:read]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: metricName
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: asOf
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Canonical metric definition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricDefinition" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.example.invalid/oauth2/authorize
          tokenUrl: https://identity.example.invalid/oauth2/token
          scopes:
            analysis:run: Submit analytical questions
            conversation:read: Read visible conversation history
            metadata:read: Read published governed metadata
            approval:decide: Decide governed approval requests
  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Printable caller request ID; the server replaces invalid values.
      schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
  headers:
    RequestId:
      required: true
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Conversation:
      type: object
      additionalProperties: false
      required: [conversationId, status, createdAt, updatedAt, version]
      properties:
        conversationId: { type: string, format: uuid }
        title: { type: string, maxLength: 256 }
        status: { type: string, enum: [active, archived] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 0 }
    ConversationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Conversation" }
        nextCursor: { type: string, maxLength: 512 }
    SubmitMessageRequest:
      type: object
      additionalProperties: false
      required: [question, clientTimezone]
      properties:
        question: { type: string, minLength: 1, maxLength: 4000 }
        clientTimezone: { type: string, minLength: 1, maxLength: 64, example: America/Los_Angeles }
        locale: { type: string, minLength: 2, maxLength: 16, default: en-US }
    RunAccepted:
      type: object
      additionalProperties: false
      required: [runId, conversationId, requestId, state, statusUrl, eventsUrl]
      properties:
        runId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        requestId: { type: string }
        state: { type: string, enum: [accepted, running, clarification, unsafe, approval_required, completed, failed, budget_exceeded] }
        statusUrl: { type: string, format: uri-reference }
        eventsUrl: { type: string, format: uri-reference }
        answer:
          $ref: "#/components/schemas/GroundedAnswer"
    GroundedAnswer:
      type: object
      additionalProperties: false
      required: [text, intent, citations, limitations]
      properties:
        text: { type: string, maxLength: 16000 }
        intent: { type: string, enum: [documentation, metadata, analytical, clarification, unsafe] }
        citations:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/Citation" }
        limitations:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 500 }
    Citation:
      type: object
      additionalProperties: false
      required: [evidenceId, title]
      properties:
        evidenceId: { type: string }
        title: { type: string }
        sourceVersion: { type: string }
        uri: { type: string, format: uri-reference }
    ApprovalDecision:
      type: object
      additionalProperties: false
      required: [decision, expectedVersion]
      properties:
        decision: { type: string, enum: [approve, edit, reject] }
        expectedVersion: { type: integer, minimum: 0 }
        editedAction: { type: object }
        comment: { type: string, maxLength: 2000 }
    Approval:
      type: object
      additionalProperties: false
      required: [approvalId, state, version]
      properties:
        approvalId: { type: string, format: uuid }
        state: { type: string, enum: [pending, approved, rejected, expired] }
        version: { type: integer, minimum: 0 }
    Feedback:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating: { type: string, enum: [up, down] }
        comment: { type: string, maxLength: 4000 }
        correction: { type: string, maxLength: 8000 }
    MetadataSearchResponse:
      type: object
      additionalProperties: false
      required: [items, publicationVersion]
      properties:
        publicationVersion: { type: string }
        items:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [entityId, entityType, name, description, version, score]
            properties:
              entityId: { type: string }
              entityType: { type: string, enum: [dataset, column, metric, document] }
              name: { type: string }
              description: { type: string }
              version: { type: string }
              score: { type: number, minimum: 0, maximum: 1 }
    DatasetSchema:
      type: object
      additionalProperties: false
      required: [datasetId, name, grain, owner, version, columns, joins, publishedAt]
      properties:
        datasetId: { type: string }
        name: { type: string }
        description: { type: string }
        grain: { type: string }
        owner: { type: string }
        version: { type: string }
        publishedAt: { type: string, format: date-time }
        columns:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: false
            required: [name, dataType, nullable, classification]
            properties:
              name: { type: string }
              dataType: { type: string }
              description: { type: string }
              nullable: { type: boolean }
              classification: { type: string, enum: [public, internal, confidential, restricted] }
              partition: { type: boolean, default: false }
        joins:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/JoinEdge" }
    JoinEdge:
      type: object
      additionalProperties: false
      required: [fromDataset, fromColumns, toDataset, toColumns, cardinality, version]
      properties:
        fromDataset: { type: string }
        fromColumns: { type: array, minItems: 1, items: { type: string } }
        toDataset: { type: string }
        toColumns: { type: array, minItems: 1, items: { type: string } }
        cardinality: { type: string, enum: [one_to_one, one_to_many, many_to_one] }
        version: { type: string }
    MetricDefinition:
      type: object
      additionalProperties: false
      required: [name, description, formula, requiredMeasures, allowedAggregation, owner, version, validFrom]
      properties:
        name: { type: string }
        description: { type: string }
        formula: { type: string }
        requiredMeasures: { type: array, minItems: 1, items: { type: string } }
        requiredDimensions: { type: array, items: { type: string } }
        allowedAggregation: { type: string }
        owner: { type: string }
        version: { type: string }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        requestId: { type: string }
